# App del computador (app-test-pc). Genera los instaladores de Windows (.exe) y Mac (.dmg) en máquinas de GitHub.
# Se descargan desde la pestaña Actions > la última ejecución > Artifacts.
name: Instaladores

on:
  push:
    branches: [master]
    paths: ['app-test-pc/**', '.github/workflows/instaladores.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: app-test-pc

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-test-pc/package-lock.json
      - run: npm ci
      - run: node --test "tests/*.test.ts"
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: app-test-pc/dist/*.exe
          retention-days: 30

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-test-pc/package-lock.json
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-mac
          path: app-test-pc/dist/*.dmg
          retention-days: 30
