<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d5a83"/>
      <stop offset="0.55" stop-color="#023047"/>
      <stop offset="1" stop-color="#011a29"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#fb8501"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#fb8501" flood-opacity="0.45"/>
    </filter>
    <clipPath id="shape"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#shape)">
    <rect x="100" y="100" width="824" height="460" fill="url(#shine)"/>
    <!-- Pantalla con la tira de cuadros -->
    <rect x="232" y="292" width="560" height="440" rx="64" fill="url(#screen)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
    <g fill="#ffffff" fill-opacity="0.28">
      <rect x="268" y="324" width="44" height="30" rx="8"/><rect x="268" y="390" width="44" height="30" rx="8"/>
      <rect x="268" y="456" width="44" height="30" rx="8"/><rect x="268" y="522" width="44" height="30" rx="8"/>
      <rect x="268" y="588" width="44" height="30" rx="8"/><rect x="268" y="654" width="44" height="30" rx="8"/>
      <rect x="712" y="324" width="44" height="30" rx="8"/><rect x="712" y="390" width="44" height="30" rx="8"/>
      <rect x="712" y="456" width="44" height="30" rx="8"/><rect x="712" y="522" width="44" height="30" rx="8"/>
      <rect x="712" y="588" width="44" height="30" rx="8"/><rect x="712" y="654" width="44" height="30" rx="8"/>
    </g>
    <!-- Botón de reproducir -->
    <path d="M452 408c0-22 24-36 43-25l150 87c19 11 19 39 0 50l-150 87c-19 11-43-3-43-25z" fill="url(#play)" filter="url(#glow)"/>
    <!-- Destello de la IA -->
    <path d="M760 214l17 47 47 17-47 17-17 47-17-47-47-17 47-17z" fill="#ffffff"/>
    <path d="M812 352l8 22 22 8-22 8-8 22-8-22-22-8 22-8z" fill="#ffffff" fill-opacity="0.8"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
